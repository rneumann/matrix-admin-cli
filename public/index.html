<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Matrix Admin</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="login-view" class="login-view">
    <form id="login-form" class="login-form">
      <h1>Matrix Admin</h1>
      <label>
        Benutzer
        <input id="login-username" type="text" autocomplete="username" placeholder="localpart oder @user:server" required />
      </label>
      <label>
        Passwort
        <input id="login-password" type="password" autocomplete="current-password" required />
      </label>
      <button type="submit">Anmelden</button>
      <p id="login-error" class="error"></p>
    </form>
  </div>

  <div id="app-view" class="app-view hidden">
    <header>
      <h1>Matrix Admin</h1>
      <div class="user-info">
        <span id="current-user"></span>
        <button id="logout-btn" class="link-btn">Abmelden</button>
      </div>
    </header>
    <main>
      <aside id="tree-panel">
        <div class="tree-toolbar">
          <button id="new-space-btn" title="Neuen Space anlegen">+ Space</button>
          <button id="new-room-btn" title="Neuen Raum anlegen">+ Raum</button>
          <button id="refresh-btn" title="Baum neu laden">⟳</button>
        </div>
        <p class="hint small">Kontext fuer "Neu": <span id="context-label">Wurzel</span></p>
        <div id="tree-root" class="tree"></div>
      </aside>
      <section id="detail-panel">
        <p class="hint">Waehle links einen Space oder Raum aus.</p>
      </section>
    </main>
  </div>

  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal" class="modal"></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
